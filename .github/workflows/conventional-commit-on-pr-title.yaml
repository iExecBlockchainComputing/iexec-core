name: Conventional Commit as PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  lint-pr-title:
    # Prevent execution on forks
    if: github.repository_owner == 'iExecBlockchainComputing'
    permissions:
      pull-requests: read
    # conventional-commits-v1.2.3
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/conventional-commits.yml@36e876b00619725344c27c59748cc44d0d4d6e44
